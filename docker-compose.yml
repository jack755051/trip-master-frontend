# 💡 第一行的 version: "3.8" 既然會報 warning，可以直接刪除整行沒關係

services:
  trip-master-frontend:
    image: trip-master-frontend:${NEXT_PUBLIC_APP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "3000" # ⚠️ 這裡只能寫 "3000"
    restart: always
    networks:
      - trip-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - trip-master-frontend
    restart: always
    networks:
      - trip-network

networks:
  trip-network:
    name: trip-network
    driver: bridge
