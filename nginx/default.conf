# nginx/default.conf
server {
    listen 80;

    # 1. 將 /api 開頭的請求，轉發給後端容器 (假設後端容器名為 trip-backend)
    location /api/ {
        proxy_pass http://trip-backend:8080/api/; # 利用 Docker 內部 DNS 解析
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. 其他所有請求，轉發給前端 Next.js 容器
    location / {
        proxy_pass http://trip-master-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}